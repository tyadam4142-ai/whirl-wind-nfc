      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      background: 
        radial-gradient(circle at 15% 30%, rgba(216, 180, 140, 0.25) 0%, transparent 50%),
        radial-gradient(circle at 85% 70%, rgba(11, 37, 69, 0.08) 0%, transparent 50%),
        linear-gradient(135deg, #f7f3ec 0%, #ebe4d8 100%);
    }

    /* Simulated Architectural Fluted Panel Effect on Left */
    .interior-bg::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 18%;
      height: 100%;
      background: repeating-linear-gradient(
        90deg,
        rgba(168, 131, 93, 0.12),
        rgba(168, 131, 93, 0.12) 12px,
        rgba(215, 186, 153, 0.05) 12px,
        rgba(215, 186, 153, 0.05) 24px

      opacity: 0.7;

    /* Ambient Canvas Particles */

      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

      z-index: 2;

    }

    @keyframes cardEntrance {

      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    document.addEventListener('DOMContentLoaded', () => {

    // Subtle Ambient Floating Dust Particles for Interior Feel
    function initParticleBackground() {
      const canvas = document.getElementById('particle-canvas');
      if (!canvas) return;

      const ctx = canvas.getContext('2d');
      let width = (canvas.width = window.innerWidth);
      let height = (canvas.height = window.innerHeight);

      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      const particles = [];
      const particleCount = Math.min(Math.floor(width / 25), 24);

      class Particle {
        constructor() { this.reset(); }
        reset() {
          this.x = Math.random() * width;
          this.y = Math.random() * height;
          this.size = Math.random() * 2 + 0.8;
          this.speedY = -(Math.random() * 0.2 + 0.05);
          this.speedX = (Math.random() - 0.5) * 0.15;
          this.opacity = Math.random() * 0.4 + 0.1;
        }
        update() {
          this.y += this.speedY;
          this.x += this.speedX;
          if (this.y < 0 || this.x < 0 || this.x > width) {
            this.reset();
            this.y = height + 10;
          }
        }
        draw() {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(180, 150, 110, ${this.opacity})`;
          ctx.shadowBlur = 4;
          ctx.shadowColor = 'rgba(180, 150, 110, 0.4)';
          ctx.fill();
        }
      }

      for (let i = 0; i < particleCount; i++) particles.push(new Particle());

      function animate() {
        ctx.clearRect(0, 0, width, height);
        particles.forEach((p) => { p.update(); p.draw(); });
        requestAnimationFrame(animate);
      }
      animate();
    }

    // Dynamic vCard (.vcf) Generator for Husain Chopdawala

        const vCardData = [
